name: Hearth Pi
version: "0.1.0"
slug: hearth_pi
url: https://github.com/cosmyo/ha-pi-durable
description: Independent experimental durable AI assistant with read-only tools by default
arch:
  - aarch64
  - amd64
stage: experimental
startup: application
boot: auto
init: true
timeout: 30
ingress: true
ingress_port: 8099
panel_icon: mdi:fire
panel_title: Hearth Pi
panel_admin: true
homeassistant_api: true
backup: cold
options:
  authorized_user_ids: []
  service_actions_enabled: false
  allowed_services: []
  allowed_entities: []
  public_origin: "https://home.example"
  provider: offline
  model: "gpt-4.1-mini"
  openai_api_key: ""
schema:
  authorized_user_ids:
    - str
  service_actions_enabled: bool
  allowed_services:
    - str
  allowed_entities:
    - str
  public_origin: str
  provider: list(offline|openai)
  model: str
  openai_api_key: password
