name: Hearth Pi
version: "0.6.0"
slug: hearth_pi
url: https://github.com/cosmyo/ha-pi-durable
description: Independent experimental durable AI assistant with read-only tools by default
arch:
  - aarch64
  - amd64
stage: experimental
startup: application
boot: auto
init: true
timeout: 30
ingress: true
ingress_port: 8099
panel_icon: mdi:fire
panel_title: Hearth Pi
# Shown to every HA user so household members and guests (usually not HA
# admins) can open it; the server authorizes each request against
# authorized_user_ids regardless (see docs/security.md).
panel_admin: false
homeassistant_api: true
# Admin access mode (owner opt-in, see access_mode below) needs Supervisor's
# own REST API for add-on/backup/host actions: Core's "supervisor/api"
# WebSocket command rejects the add-on's Supervisor-proxied connection, so
# Hearth calls http://supervisor directly instead. Manifest permissions are
# fixed at install time for every installation; Scoped mode still never
# registers or calls a Supervisor tool (policy-level, src/ha.ts). See
# DOCS.md "Admin access mode" and docs/security.md for what "manager" allows.
hassio_api: true
hassio_role: manager
backup: cold
# Hearth Assist (assist_enabled): Hearth publishes its Core link (host, port,
# API version and a link secret) to Home Assistant Core only, through
# Supervisor discovery. The listener port is never published to the host.
discovery:
  - hearth_pi
breaking_versions:
  - "0.2.0"
# Only this App's own bridge directory, never HA Core configuration.
map:
  - type: addon_config
    read_only: false
    path: /workspace_link
options:
  authorized_user_ids: []
  service_actions_enabled: false
  allowed_services: []
  allowed_entities: []
  public_origin: "https://home.example"
  provider: offline
  anthropic_auth_enabled: false
  model: ""
  openai_api_key: ""
  workspace_enabled: false
  workspace_owner_ids: []
  access_mode: scoped
  risk_judge_model: auto
  risk_judge_url: ""
  risk_judge_api_key: ""
  risk_judge_timeout_ms: 15000
  risk_judge_session_ttl_ms: 300000
  injection_guard_url: ""
  injection_guard_api_key: ""
  injection_guard_timeout_ms: 3000
  briefing_summary_model: auto
  approval_notifications: false
  member_user_ids: []
  guest_user_ids: []
  trusted_user_ids: []
  assist_enabled: false
  assist_satellites: []
schema:
  authorized_user_ids:
    - str
  service_actions_enabled: bool
  allowed_services:
    - str
  allowed_entities:
    - str
  public_origin: str
  provider: list(offline|openai|openai-codex|anthropic|local)
  anthropic_auth_enabled: bool
  model: str
  openai_api_key: password
  workspace_enabled: bool
  workspace_owner_ids:
    - str
  access_mode: list(scoped|admin)
  risk_judge_model: str
  risk_judge_url: str
  risk_judge_api_key: password
  risk_judge_timeout_ms: int(1000,30000)
  risk_judge_session_ttl_ms: int(0,3600000)
  injection_guard_url: str
  injection_guard_api_key: password
  injection_guard_timeout_ms: int(500,30000)
  briefing_summary_model: str
  approval_notifications: bool
  member_user_ids:
    - str
  guest_user_ids:
    - str
  trusted_user_ids:
    - str
  assist_enabled: bool
  assist_satellites:
    - device_id: str
      user_id: str
