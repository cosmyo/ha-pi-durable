name: Hearth Pi
version: "0.2.0"
slug: hearth_pi
url: https://github.com/cosmyo/ha-pi-durable
description: Independent experimental durable AI assistant with read-only tools by default
arch:
  - aarch64
  - amd64
stage: experimental
startup: application
boot: auto
init: true
timeout: 30
ingress: true
ingress_port: 8099
panel_icon: mdi:fire
panel_title: Hearth Pi
panel_admin: true
homeassistant_api: true
backup: cold
breaking_versions:
  - "0.2.0"
# Only this App's own bridge directory, never HA Core configuration.
map:
  - type: addon_config
    read_only: false
    path: /workspace_link
options:
  authorized_user_ids: []
  service_actions_enabled: false
  allowed_services: []
  allowed_entities: []
  public_origin: "https://home.example"
  provider: offline
  model: ""
  openai_api_key: ""
  workspace_enabled: false
schema:
  authorized_user_ids:
    - str
  service_actions_enabled: bool
  allowed_services:
    - str
  allowed_entities:
    - str
  public_origin: str
  provider: list(offline|openai|openai-codex|local)
  model: str
  openai_api_key: password
  workspace_enabled: bool
